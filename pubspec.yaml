name: bianqian
description: "一款基于 Flutter 的 Windows 桌面便签应用 (Fluent Design 风格)。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---- UI ----
  # Windows 11 Fluent Design 风格组件库
  fluent_ui: ^4.9.2
  # 可选：用于自定义标题栏的栏位（这里我们使用 window_manager 即可）
  # bitsdojo_window: ^0.1.6

  # ---- 状态管理 ----
  flutter_riverpod: ^2.5.1

  # ---- 本地存储 (Hive NoSQL) ----
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # ---- 桌面窗口管理 ----
  window_manager: ^0.4.2

  # ---- 系统托盘 ----
  tray_manager: ^0.2.3
  # 备选：system_tray: ^2.0.3 (依赖原生编译, tray_manager 更稳定)

  # ---- 工具类 ----
  uuid: ^4.4.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ---- Hive 代码生成 ----
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
